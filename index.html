<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<title>Richard's Motion Lab</title>
<style>
:root{
  --bg:#0B0D10; --card:#14181D; --border:#232A33; --text:#E9ECF1; --muted:#8B93A1;
  --volt:#C9F24B; --sky:#59C3F0; --clay:#FF6B4A; --ok:#55D68A;
  --volt-dim:rgba(201,242,75,.12); --sky-dim:rgba(89,195,240,.10); --clay-dim:rgba(255,107,74,.12);
  --ok-dim:rgba(85,214,138,.12);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
[hidden]{display:none !important}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
input,textarea,select{font:inherit;color:var(--text)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px;border-radius:6px}
svg.ic{width:20px;height:20px;flex:none;vertical-align:-4px}

#app{min-height:100dvh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.page{max-width:680px;margin:0 auto;padding:16px 16px 8px;animation:viewin .18s ease}
@keyframes viewin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.display{font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.brandline{font-size:12px;font-weight:800;letter-spacing:.22em;color:var(--muted);margin:2px 0 10px;text-transform:uppercase}
.h-big{font-size:26px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.card.tight{padding:12px 14px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

.btn{min-height:44px;border-radius:12px;border:1px solid var(--border);background:#1A2027;color:var(--text);font-size:15px;font-weight:600;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--volt);color:#0B0D10;border-color:var(--volt)}
.btn.danger{background:var(--clay);color:#0B0D10;border-color:var(--clay)}
.btn.ghost{background:transparent}
.btn.small{min-height:38px;font-size:13px;padding:0 12px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pill{border-radius:999px;padding:0 14px}
.btn.on-solid{background:var(--ok);border-color:var(--ok);color:#0B0D10}
.btn.on-shaky{background:var(--clay);border-color:var(--clay);color:#0B0D10}

.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.chip.sky{color:var(--sky);border-color:rgba(89,195,240,.45);background:var(--sky-dim)}
.chip.volt{color:var(--volt);border-color:rgba(201,242,75,.45);background:var(--volt-dim)}
.chip.clay{color:var(--clay);border-color:rgba(255,107,74,.45);background:var(--clay-dim)}
.chip.ok{color:var(--ok);border-color:rgba(85,214,138,.45);background:var(--ok-dim)}

.seg{display:flex;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:44px;font-weight:700;color:var(--muted);border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--volt);color:#0B0D10}

.sess{display:block;width:100%;text-align:left;border-left:4px solid var(--border);cursor:pointer}
.sess.sky{border-left-color:var(--sky)}
.sess.volt{border-left-color:var(--volt)}
.sess .s-name{font-size:18px}
.sess .s-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:2px}
.s-done{color:var(--ok);display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13px}
.s-min{color:var(--muted);font-size:13px;font-weight:600}

.banner{border-radius:14px;padding:12px 16px;margin:0 0 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.amber{background:var(--clay-dim);border:1px solid rgba(255,107,74,.4);color:#FFB4A3}
.banner.skyb{background:var(--sky-dim);border:1px solid rgba(89,195,240,.35);color:#A8DDF6}
.banner .grow{flex:1}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(11,13,16,.96);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:680px;margin:0 auto;display:flex}
.navbtn{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.navbtn svg.ic{width:22px;height:22px}
.navbtn.on{color:var(--volt)}

.weekgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wk{position:relative;border:1px solid var(--border);border-radius:10px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card)}
.wk .n{font-weight:800;font-size:18px}
.wk.p1{border-color:rgba(89,195,240,.4);background:var(--sky-dim)}
.wk.p2{border-color:rgba(201,242,75,.4);background:var(--volt-dim)}
.wk.p3{border-color:rgba(255,107,74,.4);background:var(--clay-dim)}
.wk.cur{outline:2px solid var(--text);outline-offset:2px}
.wk .dbadge{position:absolute;top:4px;right:6px;font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--sky)}

.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea{width:100%;background:#0E1116;border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-height:44px}
.field textarea{min-height:70px;resize:vertical}
input[type=range]{width:100%;min-height:44px;accent-color:var(--volt)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}

.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:12px}
table.tbl{border-collapse:collapse;width:100%;min-width:620px;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
.tbl th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tbl tr:last-child td{border-bottom:none}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend .sw{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

.bars{display:flex;gap:8px;align-items:flex-end;height:96px;padding-top:6px}
.bars .bwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .bar{width:100%;max-width:34px;border-radius:6px 6px 3px 3px;background:var(--volt);min-height:3px}
.bars .bzero{background:var(--border)}
.bars .bcur{outline:1.5px solid var(--text)}
.bars .blab{font-size:10px;color:var(--muted);font-weight:700}
.bars .bnum{font-size:11px;font-weight:800}

.lvlchip{border:1px solid var(--volt);color:var(--volt);border-radius:999px;min-width:52px;min-height:36px;font-weight:800;font-size:13px;letter-spacing:.06em;display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.excard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.excard.locked{opacity:.75;border-style:dashed}
.ex-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-name{font-weight:700;font-size:17px;line-height:1.3}
.ex-dose{font-weight:700;margin-top:2px}
.ex-cue{color:var(--muted);font-size:14px;margin-top:4px}
.lr{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--sky);border:1px solid rgba(89,195,240,.45);border-radius:5px;padding:1px 5px;vertical-align:1px}
.ticks{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.ticklab{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted);width:36px;flex:none}
.tick{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);color:var(--muted);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.tick.on{background:var(--volt);border-color:var(--volt);color:#0B0D10}
.ex-tools{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.tbtn{border:1px solid var(--border);border-radius:10px;min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;background:#1A2027}
a.tbtn{text-decoration:none;color:var(--text)}
.formsvg{width:100%;height:auto;display:block}
.formcard{padding:10px 12px}
.cuelist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.cuelist li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:#C7CDD6;line-height:1.4}
.cnum{flex:none;width:19px;height:19px;border-radius:50%;background:var(--volt);color:#0B0D10;font-weight:800;font-size:11px;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.rest-note{margin-top:10px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
details.why{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px}
details.why summary{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:7px;list-style:none}
details.why summary::-webkit-details-marker{display:none}
details.why summary .chev{display:inline-flex;transition:transform .15s ease}
details[open].why summary .chev{transform:rotate(90deg)}
details.why p{margin:6px 0;font-size:14px;color:#C7CDD6}
.tendernote{color:#FFB4A3;background:var(--clay-dim);border:1px solid rgba(255,107,74,.3);border-radius:10px;padding:8px 10px;font-size:13px}
.lockline{display:flex;gap:8px;align-items:flex-start;margin-top:8px;color:var(--muted);font-size:13px}
.blk{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.blk:first-child{margin-top:4px}

.ex-cues{margin-top:5px;display:flex;flex-direction:column;gap:2px}
.ex-cues span{color:var(--muted);font-size:13.5px;line-height:1.35}
.ex-cues b{color:var(--volt);font-weight:800;font-size:11px;margin-right:6px}
.excard.current{border-color:rgba(201,242,75,.55)}
.excard{scroll-margin-top:84px}
#ptimer .tsub{font-size:13px;color:var(--muted);font-weight:600}
#ptimer .tbtns{display:flex;gap:10px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.qname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.qname b{color:var(--muted);font-weight:700;margin-left:4px}
.qpills{display:flex;gap:6px;width:176px;flex:none}
.qpills .btn{flex:1;min-width:0;padding:0 6px}
.weekctl{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 6px}
.weekctl .btn{min-width:52px}
.weekctl .wlab{font-weight:800;min-width:56px;text-align:center;font-size:18px}
.chartnote{font-size:12px;color:var(--muted);margin-top:4px}
.upnext{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px;color:var(--muted)}
.upnext strong{color:var(--text);font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.lvlgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:8px}
.lvlcell{display:flex;justify-content:space-between;gap:8px;min-width:0}
.lvlcell .lname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;color:#C7CDD6}
/* v2: Today hero, squat panel, arc, focused player, quiet identity */
.hero{display:block;width:100%;text-align:left;border:1px solid var(--border);border-left:4px solid var(--volt);background:var(--card);border-radius:14px;padding:16px;margin:0 0 10px}
.hero .h-name{font-size:24px}
.hero .h-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.modechip{border:1px solid var(--border);border-radius:999px;min-height:36px;padding:0 12px;font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--muted);background:#1A2027}
.h-start{margin-top:12px;width:100%}
.sessmini{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.sessmini .m-name{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sessmini .m-est{color:var(--muted);font-size:12px;font-weight:700;flex:none}
.chrome{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.03em}
.chrome .dnum{color:var(--text)}
.sqpanel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.sq-kw{font-size:44px;line-height:1;letter-spacing:.02em}
.sq-l{display:flex;gap:18px;margin-top:6px}
.sq-trio{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.arc12{display:flex;gap:4px;margin-top:6px}
.arc12 i{flex:1;height:8px;border-radius:3px;background:var(--border)}
.arc12 i.done{background:var(--volt)}
.arc12 i.now{outline:1.5px solid var(--text)}
.sqphotos{display:flex;gap:10px;margin-top:12px}
.sqphoto{margin:0;flex:1;min-width:0}
.sqphoto img{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--border)}
.sqphoto figcaption{text-align:center;margin-top:4px}
.sessglyph{color:var(--muted);flex:none}
.sess{border-left-color:#4A5462 !important}
.sess .s-name{color:var(--text)}
.sessmini svg.ic,.hero svg.ic{width:22px;height:22px}
.dnum{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:.05em}
.tick{transition:background .15s ease,border-color .15s ease,color .15s ease}
.exrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:8px}
.exrow .r-name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exrow .r-dose{color:var(--muted);font-size:12px;font-weight:700;flex:none}
.exrow .r-done{color:var(--ok);flex:none}
.exrow .r-open{color:var(--muted);flex:none;opacity:.7}
.restpills{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex:1;min-width:0;padding:2px 0}
.restpills .rbtn{min-width:46px;min-height:40px;padding:0 12px;font-size:13px;flex:none}
.restmain{min-height:44px;flex:none}
.pfoot-in + .pfoot-in{margin-top:8px}
.lvlbeat{animation:lvlbeat .5s ease}
@keyframes lvlbeat{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
#sumring .prog{transition:stroke-dasharray .8s ease}
.libfilter{display:flex;gap:6px;margin-bottom:10px}
.chipbtn{border:1px solid var(--border);border-radius:999px;min-height:36px;padding:0 12px;font-size:12px;font-weight:800;color:var(--muted);background:var(--card)}
.chipbtn.on{color:#0B0D10;background:var(--volt);border-color:var(--volt)}
.liftdots{display:flex;gap:8px;justify-content:center;margin-top:8px}
.liftdot{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);color:var(--muted);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;background:var(--card)}
.liftdot.on{background:var(--volt);border-color:var(--volt);color:#0B0D10}
.qrow-note{margin-top:4px}
.excard .cardpills{display:flex;gap:6px;margin-top:10px}
.excard .cardpills .btn{min-height:38px;flex:1}
#player{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.phead{position:sticky;top:0;z-index:5;background:rgba(11,13,16,.97);border-bottom:1px solid var(--border);padding:10px 16px calc(10px)}
.pprog{position:absolute;left:0;right:0;bottom:0;height:3px}
.pprog i{display:block;height:100%;background:var(--volt);width:0}
.phead-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
.phead .t{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-in{max-width:680px;margin:0 auto;padding:12px 16px calc(150px + env(safe-area-inset-bottom))}
.pfoot{position:fixed;bottom:0;left:0;right:0;z-index:6;background:rgba(11,13,16,.97);border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.pfoot-in{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.restgrp{display:flex;gap:6px;align-items:center}
.restgrp .rlab{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.rbtn{min-width:58px;min-height:44px;border:1px solid var(--border);border-radius:10px;font-weight:800;font-size:14px;background:#1A2027}
.contacts{display:flex;flex-direction:column;font-size:12px;font-weight:700;color:var(--muted);line-height:1.3;margin-right:auto}
.contacts .over{color:var(--clay)}

#ptimer{position:fixed;inset:0;z-index:55;background:rgba(11,13,16,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#ptimer .tlab{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
#ptimer .ttime{font-size:76px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:.02em}
#ptimer.ringdone .ttime{color:var(--volt)}
.ringwrap{position:relative;width:230px;height:230px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .rin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}

#modal-root{position:fixed;inset:0;z-index:60;background:rgba(4,6,8,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-width:680px;max-height:84dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(24px + env(safe-area-inset-bottom));animation:sheetup .2s ease}
@keyframes sheetup{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:700px){#modal-root{align-items:center;padding:20px}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 4px;font-size:20px}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:12px}

#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);z-index:70;background:#1A2027;border:1px solid var(--border);color:var(--text);border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#storagewarn{position:fixed;top:0;left:0;right:0;z-index:80;background:var(--clay);color:#0B0D10;font-weight:700;font-size:13px;padding:8px 14px;display:flex;align-items:center;gap:10px;justify-content:center}
#storagewarn button{color:#0B0D10;font-weight:800;min-width:44px;min-height:44px;display:flex;align-items:center}

.rung{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card)}
.rung.cur{border-color:var(--volt);background:var(--volt-dim)}
.rung .rt{font-size:14px;flex:1}
.rung.disabled{opacity:.55}
.gaterow{padding:10px 0;border-bottom:1px solid var(--border)}
.gaterow:last-child{border-bottom:none}

    { "id": "a2", "session": "A", "block": "prep", "name": "Slow calf raises off step", "why": "Warm load through the achilles before deep knee work.", "cues": ["3 seconds down", "Full stretch at the bottom", "Quiet control"], "dose": { "1": "2x10", "2": "2x10", "3": "2x10" }, "rest": "30s", "levels": null },

    { "id": "a7", "session": "A", "block": "core", "name": "Tempo goblet squat", "why": "Turn new range into strength: slow reps to your deepest clean depth.", "cues": ["3 down, 1 pause, drive up", "Depth only as deep as stays clean", "Elbows inside knees at the bottom"], "dose": { "2": "3x6", "3": "4x6" }, "rest": "90s", "levels": ["L1: 8kg", "L2: 12kg", "L3: 16kg", "L4: 20kg", "L5: 24kg"] },
    { "id": "a8", "session": "A", "block": "core", "name": "Bar hang + scap pulls", "why": "Decompression and shoulder health: the full-body piece of squat day.", "cues": ["Passive hang first, then pull shoulder blades down", "Long exhale"], "dose": { "1": "3x20s", "2": "3x30s", "3": "3x30s" }, "rest": "45s", "levels": ["L1: feet assisted hang", "L2: passive hang", "L3: active hang, shoulders down", "L4: side to side shifts", "L5: scap pull-ups plus slow swings"] },

    { "id": "b9", "session": "B", "block": "core", "name": "Hurdle hops", "why": "Repeated elastic jumps: earned, not given. Unlocks only when landings and pogos are proven.", "cues": ["Tall hips, springy ankles", "Same rhythm every rep", "Stop the set the moment rhythm breaks"], "gate": "G3", "contactsPerSet": 6, "dose": { "3": "3x6" }, "rest": "90s", "levels": ["L1: over lines, continuous", "L2: 15cm hurdles with mini pause", "L3: 15cm continuous", "L4: 30cm with mini pause", "L5: 30cm continuous"] },
    { "id": "b10", "session": "B", "block": "core", "name": "Plyo push-up", "why": "Upper-body elasticity: the full-body piece of SPRING day.", "cues": ["Chest to target, pop off fast", "Land soft elbows, absorb"], "dose": { "1": "3x4", "2": "3x5", "3": "4x5" }, "rest": "60s", "levels": ["L1: wall pop-offs", "L2: bench pop-offs", "L3: floor pop, hands leave", "L4: clap push-up", "L5: drop from low plates into pop"] },

    { "id": "c6", "session": "C", "block": "core", "name": "Couch stretch, contract-relax", "why": "Front-of-hip length: the desk-sitting antidote and the back leg of every lunge.", "cues": ["Rear foot on wall or bench, squeeze glute", "5s gentle push into the floor, then relax deeper", "Torso taller each round"], "dose": { "1": "2x45s/side", "2": "2x45s/side", "3": "2x60s/side" }, "rest": "30s", "levels": ["L1: knee far from wall, hands on floor", "L2: closer, hands on knee", "L3: torso upright", "L4: upright plus reach overhead", "L5: back foot elevated pulses"] },

    { "id": "c9", "session": "C", "block": "core", "name": "Ground flow rounds", "why": "Glue the ranges together: squat, sit-through, crab reach, beast, stand. Moving is the point.", "cues": ["Slow is smooth", "No dead stops between shapes", "Breathe through transitions"], "dose": { "1": "2x60s", "2": "3x75s", "3": "3x90s" }, "rest": "60s", "levels": ["L1: fixed loop, slow: squat, sit-through, crab reach, beast, stand", "L2: fixed loop, smooth, no resets", "L3: add lateral crawl and direction changes", "L4: freestyle, no repeated shape", "L5: freestyle with tempo changes"] },

/* ---------- store ---------- */
const STORE_KEY = "motionlab.v1";
// Replaces unpaired surrogates (damage from a truncated write) with U+FFFD
// so the storage layer will accept the copy; every readable character of
// the damaged payload survives. No lookbehind: keeps iOS 16.0 JSC safe.
function sanitizeUtf16(s){
  let out = "";
  for(let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i);
    if(c >= 0xD800 && c <= 0xDBFF){
      const n = s.charCodeAt(i + 1);
      if(n >= 0xDC00 && n <= 0xDFFF){ out += s.charAt(i) + s.charAt(i + 1); i++; }
      else out += "\uFFFD";
    } else if(c >= 0xDC00 && c <= 0xDFFF){
      out += "\uFFFD";
    } else out += s.charAt(i);
  }
  return out;
}
const BACKUP_KEY = "motionlab.backup.v1";
const Store = {
  available: true,
  readKey(k){
    // A throw means the key is unreadable, not absent: undefined (vs null
    // for a missing key) so callers never mistake damage for a fresh install.
    try{ return localStorage.getItem(k); }
    catch(e){ this.available = false; return undefined; }
  },
  writeKey(k, v){
    try{ localStorage.setItem(k, v); return true; }
    catch(e){ this.available = false; return false; }
  },
  parseState(raw){
    try{
      const p = JSON.parse(raw);
      if(p && typeof p === "object" && p.version === 1) return p;
    }catch(e){}
    return null;
  },
  loadPrimary(){
    const raw = this.readKey(STORE_KEY);
    if(raw === undefined) return { status: "corrupt", raw: null };
    if(raw == null) return { status: "empty" };
    const p = this.parseState(raw);
    return p ? { status: "ok", state: p } : { status: "corrupt", raw: raw };
  },
  loadBackup(){
    const raw = this.readKey(BACKUP_KEY);
    if(!raw) return null;
    try{
      const env = JSON.parse(raw);
      if(env && env.state && this.parseState(JSON.stringify(env.state))){
        return { at: env.at, state: env.state };
      }
    }catch(e){}
    return null;
  },
  quarantine(raw, kind){
    // The damaged bytes are evidence: each damaged payload is copied
    // byte-for-byte before any write that could touch it. A payload the
    // storage API returns as unreadable or empty cannot be preserved this
    // way, so no key is created and false is returned; callers adjust
    // their wording instead of promising a copy that does not exist.
    if(!raw) return false;
    if(this.quarantineExists(raw, kind)) return true;
    const k = "motionlab.corrupt." + (kind ? kind + "." : "") + Date.now();
    if(!this.writeKey(k, raw)){
      // WebKit can refuse to store a string with unpaired surrogates
      // (damage from a truncated write). A sanitized copy still preserves
      // every readable character of a half-written history.
      const clean = sanitizeUtf16(raw);
      if(!clean || clean === raw || !this.writeKey(k, clean)) return false;
      const backC = this.readKey(k);
      return !!(backC && backC.length === clean.length);
    }
    const back = this.readKey(k);
    if(!back || back.length !== raw.length) return false;
    return true;
  },
  quarantineExists(raw, kind){
    // Reboots of a damaged install must not stack duplicate quarantine
    // copies: on a nearly-full device that is the corruption trigger.
    try{
      const prefix = "motionlab.corrupt." + (kind ? kind + "." : "");
      const clean = sanitizeUtf16(raw);
      const n = localStorage.length;
      for(let i = 0; i < n; i++){
        const k = localStorage.key(i);
        if(!k || k.indexOf(prefix) !== 0) continue;
        const v = this.readKey(k);
        if(v != null && (v === raw || v === clean)) return true;
      }
    }catch(e){}
    return false;
  },
  save(st){
    // Backup first, separate key: an interrupted primary write never takes
    // the backup with it. The backup is the last known-good full state
    // plus its timestamp.
    const main = JSON.stringify(st);
    const clean = JSON.parse(main);
    delete clean.backup;
    const okB = this.writeKey(BACKUP_KEY, JSON.stringify({ at: new Date().toISOString(), state: clean }));
    const okP = this.writeKey(STORE_KEY, main);
    if(!okB || !okP){ this.available = false; storageWarnShow(); return false; }
    return true;
  }
};
function bootState(){
  const prim = Store.loadPrimary();
  if(prim.status === "ok"){
    // A damaged backup would be silently overwritten by the next save;
    // preserve its bytes the same way.
    const rawB = Store.readKey(BACKUP_KEY);
    if(rawB != null && !Store.parseState((() => { try{ const e = JSON.parse(rawB); return e && e.state ? JSON.stringify(e.state) : ""; }catch(err){ return ""; } })())){
      Store.quarantine(rawB, "backup");
    }
    return { state: hydrate(prim.state) };
  }
  if(prim.status === "empty") return { state: hydrate(null) };
  // Corrupt primary: quarantine the bytes, then try the backup. The app
  // never treats corruption as a fresh install.
  const kept = Store.quarantine(prim.raw, "primary");
  const bak = Store.loadBackup();
  if(bak) return { state: hydrate(bak.state), restoredAt: bak.at, kept: kept };
  // Both keys damaged: the backup's bytes are copied aside too, because
  // Start fresh and Import from the recovery screen both save() and would
  // otherwise overwrite them. Payloads the storage layer refuses to hand
  // back cannot be copied at all; the recovery screen says so instead of
  // promising a copy that does not exist.
  const rawB = Store.readKey(BACKUP_KEY);
  const keptB = rawB ? Store.quarantine(rawB, "backup") : false;
  const uncopied = [];
  if(!kept) uncopied.push("saved data");
  if(rawB && !keptB) uncopied.push("backup");
  return { blocked: true, kept: kept || keptB, uncopied: uncopied };
}

function defaultState(){
  return { version:1, createdAt:new Date().toISOString(), rawWeek:1, timeMode:40,
    levels:{}, solidStreak:{}, g4Passed:false, logs:[], benchmarks:[], tendon:[],
    settings:{sound:true}, draft:null, liftDays:[], exNotes:{}, photoGuideSeen:false };
}
function hydrate(st){
  const d = defaultState();
  const out = Object.assign(d, st || {});
  out.levels = Object.assign({}, (st && st.levels) || {});
  out.solidStreak = Object.assign({}, (st && st.solidStreak) || {});
  out.exNotes = Object.assign({}, (st && st.exNotes) || {});
  out.settings = Object.assign({sound:true}, (st && st.settings) || {});
  out.logs = Array.isArray(out.logs) ? out.logs : [];
  out.benchmarks = Array.isArray(out.benchmarks) ? out.benchmarks : [];
  out.tendon = Array.isArray(out.tendon) ? out.tendon : [];
  out.liftDays = Array.isArray(out.liftDays) ? out.liftDays : [];
  delete out.backup;
  return out;
}
const bootResult = bootState();
let state = bootResult.state || null;
const bootBlocked = !!bootResult.blocked;
let bootRestoredAt = bootResult.restoredAt || null;
const bootKept = !!bootResult.kept;
const bootUncopied = Array.isArray(bootResult.uncopied) ? bootResult.uncopied : [];
if(state && bootRestoredAt) Store.save(state);
function save(){ Store.save(state); }

function parseDose(str){
  const s = String(str);
  const m = s.match(/^(\d+)x(\d+)(s|m)?(\/side)?$/);
  if(!m) return { single:true, sets:1, reps:0, unit:"", side:false, secs:null, raw:s };
  return { single:false, sets:+m[1], reps:+m[2], unit:m[3] || "", side:!!m[4], secs:(m[3] === "s" ? +m[2] : null), raw:s };
}
function plannedSets(ex, ctx){
  const d = parseDose(ex.dose[String(ctx.phase)]);
  let sets = d.sets;
  if(ctx.deload && sets >= 3) sets -= 1;
  if(ctx.timeMode === 25 && ex.block === "core" && sets >= 3) sets -= 1;
  return sets;
}

  const d = parseDose(ex.dose[String(ctx.phase)]);
  return d.single ? 1 : plannedSets(ex, ctx);
}
function doseLabel(ex, ctx){
  const s = ex.dose[String(ctx.phase)];
  const d = parseDose(s);
  if(d.single) return s;

function restSeconds(r){
  if(!r || r === "none") return 0;
  if(r === "as needed") return 60;
  const m = String(r).match(/^(\d+)(?:-(\d+))?s?$/);
  if(!m) return 0;
  if(m[2]) return ( +m[1] + +m[2] ) / 2;
  return +m[1];
}

function mondayKey(d){
  const dt = new Date(d);
  const day = (dt.getDay() + 6) % 7;
  dt.setDate(dt.getDate() - day);
  return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
}

  const k = mondayKey(new Date());
  return state.tendon.some(t => mondayKey(new Date(t.dateISO)) === k);
}
function tendonEntriesRecent(days){
  const cutoff = Date.now() - days * 86400000;
  return state.tendon.filter(t => new Date(t.dateISO).getTime() >= cutoff);
}
function tendonClear14(){
  const recent = tendonEntriesRecent(14);
  if(recent.length === 0) return false;
  return !recent.some(t => (t.kneeAM || 0) >= 4 || (t.achillesAM || 0) >= 4);
}
function weeklyTendonSeries(){
  const byKey = {};
  for(const t of state.tendon){
    const k = mondayKey(t.dateISO);
    const v = Math.max(t.kneeAM || 0, t.achillesAM || 0);
    if(!(k in byKey) || v > byKey[k].v) byKey[k] = { v, dateISO: t.dateISO };
  }
  return Object.keys(byKey).sort().map(k => byKey[k]);
}

  const recent = tendonEntriesRecent(8);
  if(recent.some(t => (t.kneeAM || 0) >= 4 || (t.achillesAM || 0) >= 4)){
    return { flagged: true, reason: "Morning stiffness rated 4 or more this week." };
  }
  const series = weeklyTendonSeries();
  if(series.length >= 3){
    const a = series[series.length - 3], b = series[series.length - 2], c = series[series.length - 1];
    if(b.v > a.v && c.v > b.v && c.v >= 2){

    }

function sessionExList(type, ctx){

  for(const ex of PROGRAM.exercises){

function exStatsMap(){
  const m = {};
  for(const l of state.logs){
    for(const e of (l.exercises || [])){
      if(!e.done) continue;
      const s = m[e.id] || (m[e.id] = { count: 0, lastISO: null });
      s.count++;
      s.lastISO = l.dateISO;
    }
  }
  return m;
}
function depthSecondsThisCycle(){
  const c = cycleNum(state.rawWeek);
  let sec = 0;
  for(const l of state.logs){
    if(cycleNum(l.week) !== c) continue;
    const e = (l.exercises || []).find(x => x.id === "a4");
    if(!e || !e.done) continue;
    const ex = exById("a4");
    const d = parseDose(ex.dose[String(l.phase)]);
    if(!d.secs) continue;
    const sets = plannedTicks(ex, { phase: l.phase, deload: isDeload(l.week), timeMode: l.timeMode });
    sec += d.secs * sets;
  }
  return sec;
}
function cycleWeeksComplete(c){
  let n = 0;
  for(let k = (c - 1) * 12 + 1; k <= c * 12 && k <= state.rawWeek; k++){
    if(weekComplete(k)) n++;
  }
  return n;
}
function cycleReviewHtml(c){
  const from = (c - 1) * 12 + 1, to = c * 12;
  const clogs = state.logs.filter(l => l.week >= from && l.week <= to);
  const bs = state.benchmarks.filter(b => b.week >= from && b.week <= to).sort((x, y) => (x.dateISO < y.dateISO ? -1 : 1));
  let html = '<div class="blk">Cycle ' + c + ' complete</div><div class="card">';
  if(bs.length >= 2){
    const a = bs[0], b = bs[bs.length - 1];
    html += '<div class="small muted">Benchmarks, week ' + weekInCycle(a.week) + ' to week ' + weekInCycle(b.week) + "</div>";
    for(const m of PROGRAM.benchmarks){
      const av = a[m.key], bv = b[m.key];
      if(av == null || bv == null) continue;
      const delta = bv - av;
      html += '<div class="spread small"><span>' + esc(m.name) + '</span><span class="dnum tnum">' + av + " to " + bv + " " + esc(m.unit) + (delta !== 0 ? " (" + (delta > 0 ? "+" : "") + delta + ")" : "") + "</span></div>";
    }
  } else {
    html += '<div class="small muted">No benchmark pair recorded inside this cycle.</div>';
  }
  const gains = levelTimeline().filter(x => x.week >= from && x.week <= to);
  if(gains.length){
    html += '<div class="small muted" style="margin-top:8px">Levels earned</div>' +
      gains.map(g => '<div class="small">' + esc(fmtShort(g.dateISO)) + ": " + esc((exById(g.id) || {name: g.id}).name) + " L" + g.from + " to L" + g.to + "</div>").join("");
  }
  html += '<div class="small" style="margin-top:10px">' + clogs.length + " sessions · " + cycleWeeksComplete(c) + " of 12 weeks trained.</div>";
  html += '<div class="small muted" style="margin-top:6px">Range earned is range kept. Cycle ' + (c + 1) + ' starts from this floor.</div></div>';
  return html;
}
function levelTimeline(){
  const items = [];
  const seen = {};
  for(const l of state.logs){
    for(const e of (l.exercises || [])){
      if(e.id in seen){
        if(e.level > seen[e.id]) items.push({ dateISO: l.dateISO, week: l.week, id: e.id, from: seen[e.id], to: e.level });
      }
      seen[e.id] = e.level;
    }
  }
  return items;
}
function estMinutes(type, ctx){
  let total = 0;
  for(const it of sessionExList(type, ctx)){
    const d = parseDose(it.ex.dose[String(ctx.phase)]);
    const sets = plannedTicks(it.ex, ctx);
    let dur = 40;
    if(d.secs) dur = d.secs;
    else if(d.single) dur = /min/.test(d.raw) ? 120 : 100;
    const work = dur * (d.side ? 2 : 1);
    total += sets * (work + restSeconds(it.ex.rest));
  }
  const m = Math.round(total / 60 / 5) * 5;
  return Math.min(Math.max(10, m), ctx.timeMode);
}
function nextUpType(){
  const held = tendonFlag().flagged;
  const pending = ["A","B","C","D"].filter(t =>
    !state.logs.some(l => l.week === state.rawWeek && l.sessionType === t) &&
    !(t === "B" && held));
  if(!pending.length) return null;
  let best = null, bestTime = Infinity;
  for(const t of pending){
    let last = 0;
    for(const l of state.logs){
      if(l.sessionType === t){
        const ts = new Date(l.dateISO).getTime();
        if(ts > last) last = ts;
      }
    }
    if(last < bestTime){ bestTime = last; best = t; }
  }
  return best;
}
function weekComplete(w){
  return ["A","B","C","D"].every(t => state.logs.some(l => l.week === w && l.sessionType === t));
}
function weeksCompleted(){
  let n = 0;
  for(let k = 1; k <= state.rawWeek; k++) if(weekComplete(k)) n++;
  return n;
}

/* ---------- charts ---------- */
function chartSvg(series, ref, fixed){
  const W = 320, H = 152, L = 36, R = 12, T = 12, B = 24;
  const pts = [];
  for(const s of series) for(const p of s.points) pts.push(p);
  if(!pts.length) return '<div class="small muted" style="padding:12px 0">No data yet.</div>';
  let min = 0, max = 1;
  if(fixed){ min = fixed[0]; max = fixed[1]; }
  else {
    const vals = pts.map(p => p.y).concat(ref != null ? [ref] : []);
    min = Math.min.apply(null, vals); max = Math.max.apply(null, vals);
    if(min === max){ min -= 1; max += 1; }
    const pad = (max - min) * 0.12; min -= pad; max += pad;
  }
  const n = Math.max.apply(null, series.map(s => s.points.length));
  const X = i => (n <= 1 ? (L + (W - L - R) / 2) : L + i * (W - L - R) / (n - 1));
  const Y = v => T + (max - v) * (H - T - B) / (max - min);
  let svg = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img">';
  svg += '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '" stroke="#232A33"/>';
  svg += '<text x="4" y="' + (T + 4) + '">' + Math.round(max) + "</text>";
  svg += '<text x="4" y="' + (H - B) + '">' + Math.round(min) + "</text>";
  if(ref != null){
    svg += '<line x1="' + L + '" y1="' + Y(ref) + '" x2="' + (W - R) + '" y2="' + Y(ref) + '" stroke="#8B93A1" stroke-dasharray="4 4"/>';
    const refLabel = "ref " + ref;
    const cw = refLabel.length * 6 + 12;
    let chipY = Y(ref) + 9;
    if(chipY > H - B - 6) chipY = Y(ref) - 17;
    svg += '<rect x="' + (L + 2) + '" y="' + chipY + '" width="' + cw + '" height="13" rx="4" fill="#14181D" stroke="#232A33"/>';
    svg += '<text x="' + (L + 8) + '" y="' + (chipY + 10) + '">' + refLabel + "</text>";
  }
  for(const s of series){
    if(s.points.length > 1){
      svg += '<polyline fill="none" stroke="' + s.color + '" stroke-width="2" points="' +
        s.points.map((p, i) => X(i) + "," + Y(p.y)).join(" ") + '"/>';
    }
    for(let i = 0; i < s.points.length; i++){
      svg += '<circle cx="' + X(i) + '" cy="' + Y(s.points[i].y) + '" r="3" fill="' + s.color + '"/>';
    }
  }
  const first = pts[0].t, last = pts[pts.length - 1].t;
  if(pts.length === 1){
    svg += '<text x="' + X(0) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(first) + "</text>";
  } else {
    svg += '<text x="' + L + '" y="' + (H - 6) + '">' + esc(first) + "</text>";
    svg += '<text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(last) + "</text>";
  }
  svg += "</svg>";
  return svg;
}

function copyText(text, okMsg){
  const fallback = () => {
    let ok = false;
    try{
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    }catch(e){ ok = false; }
    toast(ok ? (okMsg || "Copied") : "Copy blocked, select the text manually");
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => toast(okMsg || "Copied"), fallback);
      return;
    }
  }catch(e){}
  fallback();
}

/* ---------- squat photos (IndexedDB, never localStorage, never uploaded) ---------- */
let photoDB = null;
function openPhotoDB(){
  return new Promise((res, rej) => {
    if(photoDB) return res(photoDB);
    try{
      const req = indexedDB.open("motionlab-photos", 1);
      req.onupgradeneeded = () => { req.result.createObjectStore("slots", { keyPath: "id" }); };
      req.onsuccess = () => { photoDB = req.result; res(photoDB); };
      req.onerror = () => rej(req.error);
    }catch(e){ rej(e); }
  });
}
function photoTx(mode, fn){
  return openPhotoDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction("slots", mode);
    fn(tx.objectStore("slots"));
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  }));
}
function photoGetAll(){
  return openPhotoDB().then(db => new Promise((res, rej) => {
    const req = db.transaction("slots").objectStore("slots").getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror = () => rej(req.error);
  })).catch(() => []);
}
function photoSlotId(cycle, weekInCyc){
  return "c" + cycle + "-w" + weekInCyc;
}
function savePhotoInput(input, cycle, weekInCyc){
  const file = input.files && input.files[0];
  if(!file) return;
  const rec = { id: photoSlotId(cycle, weekInCyc), cycle, week: weekInCyc, blob: file, takenISO: new Date().toISOString() };
  photoTx("readwrite", store => store.put(rec)).then(() => {
    state.photoGuideSeen = true;
    save();
    toast("Photo saved on this device only");
    render();
  }).catch(() => toast("Photo save failed"));
}
function deletePhoto(cycle, weekInCyc){
  photoTx("readwrite", store => store.delete(photoSlotId(cycle, weekInCyc))).then(() => {
    toast("Photo deleted");
    render();
  }).catch(() => toast("Delete failed"));
}
function renderSquatPhotos(containerId, cycle){
  const el = document.getElementById(containerId);
  if(!el) return;
  photoGetAll().then(all => {
    const mine = all.filter(p => p.cycle === cycle).sort((a, b) => a.week - b.week);
    const first = mine[0];
    const latest = mine[mine.length - 1];
    if(!first || !latest){
      el.innerHTML = '<div class="small muted">Photos: capture a side-on bottom position in benchmark weeks 1, 4, 8, 12.</div>';
      return;
    }
    const cell = (p, label) => '<figure class="sqphoto"><img alt="Squat photo week ' + p.week + '" src="' + URL.createObjectURL(p.blob) + '">' +
      '<figcaption class="small muted">' + label + " · " + esc(fmtShort(p.takenISO)) + "</figcaption></figure>";
    let html = cell(first, "Week " + first.week);
    if(latest !== first) html += cell(latest, "Week " + latest.week);
    el.innerHTML = html;
  });
}

/* ---------- audio ---------- */
let AC = null;
function ensureAudio(){
  if(AC) return;
  try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; }
}
document.addEventListener("pointerdown", () => { ensureAudio(); if(AC && AC.state === "suspended") AC.resume().catch(() => {}); }, true);
function beep(){
  if(!state.settings.sound) return;
  try{
    if(!AC) ensureAudio();
    if(!AC) return;
    if(AC.state === "suspended") AC.resume().catch(() => {});
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.25, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.5);
    o.start(); o.stop(AC.currentTime + 0.5);
  }catch(e){}
}

function liveContacts(){
  let c = 0, sec = 0;
  for(const it of P.items){
    if(it.locked) continue;
    const t = (P.ticks[it.ex.id] || []).filter(Boolean).length;
    if(it.ex.contactsPerSet) c += it.ex.contactsPerSet * t;
    if(it.ex.id === "b7" || it.ex.id === "b13"){
      const d = parseDose(it.ex.dose[String(P.ctx.phase)]);
      if(d.secs) sec += d.secs * t;
    }
  }
  return { c, sec };
}
function updateCardPills(exId){

  if(!rootEl || !P) return;
  const card = rootEl.querySelector('.excard[data-ex="' + exId + '"]');
  if(!card) return;
  const old = card.querySelector(".cardpills");
  if(old) old.remove();
  if(!exDone({ ex: exById(exId) })) return;
  const mark = P.marks[exId];
  const div = document.createElement("div");
  div.className = "cardpills";
  div.innerHTML =

    '<button class="btn small pill' + (mark === "shaky" ? " on-shaky" : "") + '" data-action="mark" data-ex="' + exId + '" data-m="shaky">Shaky</button>';

}
function updateContactsUI(){
  if(!P || P.type !== "B") return;
  const lv = liveContacts();
  const cap = PHASE_CAPS[P.ctx.phase];
  const cEl = $("#contacts-live");
  if(!cEl) return;
  const over = lv.c > cap;
  cEl.innerHTML = "<span" + (over ? ' class="over"' : "") + ">Contacts " + lv.c + "/" + cap + (over ? " · over cap, cut a set" : "") + "</span>" +
    "<span>Elastic " + lv.sec + "s</span>";
}
function exDone(it){
  const arr = P.ticks[it.ex.id];
  if(!arr) return false;
  const n = plannedTicks(it.ex, P.ctx);
  for(let i = 0; i < n; i++) if(!arr[i]) return false;
  return true;
}
function anyTicks(){
  return Object.values(P.ticks).some(a => a && a.some(Boolean));
}
function currentItemIndex(){
  // Single source of truth for which exercise owns the screen. Manual
  // selection wins until that exercise completes; then the derived
  // first-incomplete takes over. Auto-advance, manual jumpTo, the footer
  // rest button, and the progress highlight all resolve through here only.
  if(P.manualCurrent){
    const i = P.items.findIndex(it => it.ex.id === P.manualCurrent);
    if(i >= 0 && !exDone(P.items[i])) return i;
  }
  return P.items.findIndex(it => !it.locked && !exDone(it));
}
function clearCompletedManual(){
  if(!P.manualCurrent) return;
  const it = P.items.find(x => x.ex.id === P.manualCurrent);
  if(it && exDone(it)) P.manualCurrent = null;
}
function playerSetsInfo(){
  let n = 0, m = 0;
  for(const it of P.items){
    if(it.locked) continue;
    const t = plannedTicks(it.ex, P.ctx);
    m += t;
    const arr = P.ticks[it.ex.id] || [];
    for(let i = 0; i < t; i++) if(arr[i]) n++;
  }
  return { n, m };
}

/* ---------- timers ---------- */
let TMR = null;
let lastRest = 0;
let lastRestLabel = "";
let lastSet = null;
function startSetTimer(exId){
  const ex = exById(exId);
  if(!ex || !P) return;
  const done = (P.ticks[exId] || []).filter(Boolean).length;
  const total = plannedTicks(ex, P.ctx);
  showTimer(parseDose(ex.dose[String(P.ctx.phase)]).secs || 40, ex.name,
    "Set " + Math.min(done + 1, total) + " of " + total,
    { exId, rest: restSeconds(ex.rest), restLabel: ex.rest });
}
function showTimer(secs, title, sub, tctx){
  hideTimer();
  const root = $("#ptimer");
  if(!root) return;
  TMR = { endAt: Date.now() + secs * 1000, total: secs, done: false,
    exId: tctx && tctx.exId, rest: tctx && tctx.rest ? tctx.rest : 0,
    restLabel: tctx && tctx.restLabel ? tctx.restLabel : "" };
  root.hidden = false;
  root.classList.remove("ringdone");
  root.innerHTML = '<div class="tlab">' + esc(title) + "</div>" + (sub ? '<div class="tsub">' + esc(sub) + "</div>" : "") +
    '<div class="ringwrap">' +
    '<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="#232A33" stroke-width="6"/>' +
    '<circle id="pt-ring" cx="100" cy="100" r="88" fill="none" stroke="#C9F24B" stroke-width="6" stroke-linecap="round" stroke-dasharray="552.9" stroke-dashoffset="0"/></svg>' +
    '<div class="rin"><div class="ttime tnum" id="pt-time">' + fmtClock(secs) + "</div></div></div>" +
    '<div class="tbtns"><button class="btn" data-action="timerClose">Close</button></div>';
  TMR.int = setInterval(tickTimer, 200);
  tickTimer();
}
function tickTimer(){
  if(!TMR) return;
  const rem = Math.max(0, TMR.endAt - Date.now());
  const s = Math.ceil(rem / 1000);
  const tEl = $("#pt-time"), rEl = $("#pt-ring");
  if(tEl) tEl.textContent = fmtClock(s);
  if(rEl) rEl.setAttribute("stroke-dashoffset", String(552.9 * (1 - rem / (TMR.total * 1000))));
  if(rem <= 0 && !TMR.done){
    TMR.done = true;
    clearInterval(TMR.int);
    beep();
    const root = $("#ptimer");
    if(root){
      root.classList.add("ringdone");
      const lab = root.querySelector(".tlab");
      if(lab) lab.textContent = "Done";
    }
    if(TMR.exId) completeTimerSet();
    else offerNextSet();
  }
}
function offerNextSet(){
  if(!lastSet || !P) return;
  const arr = P.ticks[lastSet.exId] || [];
  const total = plannedTicks(exById(lastSet.exId), P.ctx);
  if(arr.filter(Boolean).length >= total) return;
  const n = arr.filter(Boolean).length + 1;
  const root = $("#ptimer");
  if(!root) return;
  const wrap = root.querySelector(".tbtns");
  if(wrap){
    wrap.innerHTML = '<button class="btn primary" data-action="timerNextSet">Set ' + n + " of " + total + "</button>" +
      '<button class="btn" data-action="timerClose">Close</button>';
  }
}
function completeTimerSet(){
  const id = TMR.exId;
  lastRest = TMR.rest || 0;
  lastRestLabel = TMR.restLabel || "";
  lastSet = { exId: id };
  if(P && P.ticks[id]){
    const arr = P.ticks[id];
    const idx = arr.findIndex(v => !v);
    if(idx !== -1){
      arr[idx] = true;
      const btn = document.querySelector('#player .tick[data-ex="' + id + '"][data-i="' + idx + '"]');
      if(btn){ btn.classList.add("on"); btn.innerHTML = icon("check"); }
      updateContactsUI();
      updatePlayerProgress();
      updateCardPills(id);
      state.draft = serializeP();
      Store.save(state);
    }
  }
  const root = $("#ptimer");
  if(root){
    const wrap = root.querySelector(".tbtns");
    if(wrap){
      const restTxt = lastRestLabel && lastRestLabel.indexOf("-") > -1 ? "Rest " + lastRestLabel : (lastRest > 0 ? "Rest " + lastRest + "s" : "");
      wrap.innerHTML = (restTxt ? '<button class="btn primary" data-action="timerRest">' + restTxt + "</button>" : "") +
        '<button class="btn" data-action="timerClose">Close</button>';
    }
  }
}
function hideTimer(){
  if(TMR && TMR.int) clearInterval(TMR.int);
  TMR = null;
  const root = $("#ptimer");
  if(root){ root.hidden = true; root.innerHTML = ""; }
}

/* ---------- finish flow ---------- */
function saveSession(){
  const lv = liveContacts();
  const exercises = P.items.map(it => ({
    id: it.ex.id,
    level: getLevel(it.ex.id),
    done: !it.locked && exDone(it),
    solid: !it.locked && exDone(it) && P.marks[it.ex.id] === "solid"
  }));
  const log = {
    id: "L" + Date.now(),
    dateISO: new Date().toISOString(),
    sessionType: P.type,
    week: state.rawWeek,
    phase: P.ctx.phase,
    timeMode: P.ctx.timeMode,
    rpe: P.rpe,
    note: P.note || "",
    contacts: P.type === "B" ? lv.c : null,
    exercises
  };
  state.logs.push(log);
  for(const it of P.items){
    if(it.locked) continue;
    if(it.ex.block !== "core" && it.ex.block !== "ext") continue;
    if(!it.ex.levels) continue;
    if(!exDone(it)) continue;
    const mark = P.marks[it.ex.id];
    if(mark === "solid") state.solidStreak[it.ex.id] = getStreak(it.ex.id) + 1;
    else if(mark === "shaky") state.solidStreak[it.ex.id] = 0;
  }
  recomputeG4();
  const weekNo = state.rawWeek;
  const weekTypes = ["A","B","C","D"].filter(t => state.logs.some(l => l.week === state.rawWeek && l.sessionType === t)).length;
  const weekAdvanced = weekComplete(state.rawWeek);
  const si = playerSetsInfo();
  if(weekAdvanced) state.rawWeek += 1;
  state.draft = null;
  save();
  const suggestions = [];
  if(!P.ctx.deload){
    for(const it of P.items){
      if(it.locked || !it.ex.levels || it.ex.block === "prep" || it.ex.block === "reset") continue;
      if(!exDone(it) || P.marks[it.ex.id] !== "solid") continue;
      const from = getLevel(it.ex.id);
      if(from >= 5) continue;
      if(getStreak(it.ex.id) < 2) continue;
      const to = from + 1;
      const allowed = levelAllowed(it.ex.id, to);
      let gateText = "";
      if(!allowed) gateText = GATES[(it.ex.id === "a4" ? "G1" : "G4")].criteria;
      const nextText = (it.ex.levels[to - 1] || "").replace(/^L\d+:\s*/, "");
      suggestions.push({ id: it.ex.id, name: it.ex.name, from, to, allowed, gateText, nextText });
    }
  }
  P.declined = {};
  P.summary = { weekTypes, week: weekNo, contacts: P.type === "B" ? lv.c : 0, setsDone: si.n, setsTotal: si.m, suggestions, weekAdvanced };
  P.step = "summary";
  renderPlayer();
}

    const date = ($("#bf-date") || {}).value;
    if(!date){ toast("Date is required"); return; }
    const num = id => { const v = (($("#" + id) || {}).value || "").trim(); if(v === "") return null; const n = parseFloat(v); return isNaN(n) ? null : n; };
    const entry = {
      dateISO: new Date(date + "T12:00:00").toISOString(),
      week: state.rawWeek,
      kneeWallL: num("bf-kwl"), kneeWallR: num("bf-kwr"), squatHoldS: num("bf-squat"),
      squatHoldLevel: num("bf-squatlvl"), cossackL: num("bf-cosl"), cossackR: num("bf-cosr"),
      atgLevel: num("bf-atg"), broadCm: num("bf-broad"), hangS: num("bf-hang"), toeTouchCm: num("bf-toe"),
      note: (($("#bf-note") || {}).value || "").trim()
    };
    state.benchmarks.push(entry);
    save();
    toast("Benchmark saved");
    render();
    const f = $("#bench-form");
    if(f) f.scrollIntoView({ block: "start" });
  },
  confirmOk(){
    const cb = confirmCb;
    confirmCb = null;
    closeModal();
    if(cb) cb();
  },
  confirmCancel(){ confirmCb = null; closeModal(); }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const fn = actions[el.dataset.action];
  if(fn) fn(el, e);
});
document.addEventListener("click", e => {
  const a = e.target.closest("a.vlink");
  if(!a) return;
  e.preventDefault();
  let opened = false;
  const markOpened = () => { opened = true; };
  document.addEventListener("visibilitychange", markOpened);
  window.addEventListener("blur", markOpened);
  let w = null;
  try{ w = window.open(a.href, "_blank"); }catch(err){ w = null; }
  if(w){ opened = true; try{ w.opener = null; }catch(err){} }
  setTimeout(() => {
    document.removeEventListener("visibilitychange", markOpened);
    window.removeEventListener("blur", markOpened);
    if(!opened) openVideoModal(a.href);
  }, 900);
});
document.addEventListener("input", e => {
  const el = e.target.closest("[data-input]");
  if(!el) return;
  const kind = el.dataset.input;
  if(kind === "libsearch"){
    const list = $("#lib-list");
    if(list) list.innerHTML = libGroups(el.value);
  } else if(kind === "rpe"){
    P.rpe = +el.value;
    const v = $("#rpe-val");
    if(v) v.textContent = el.value;
    state.draft = serializeP();
    Store.save(state);
  } else if(kind === "finnote"){
    P.note = el.value;
  } else if(kind === "tk"){
    const v = $("#tk-v"); if(v) v.textContent = el.value;
  } else if(kind === "ta"){
    const v = $("#ta-v"); if(v) v.textContent = el.value;
  } else if(kind === "ptk"){
    const v = $("#ptk-v"); if(v) v.textContent = el.value;
  } else if(kind === "pta"){
    const v = $("#pta-v"); if(v) v.textContent = el.value;
  } else if(kind === "exnote"){
    state.exNotes[el.dataset.ex] = el.value;
    save();
  }
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-photo]");
  if(el) savePhotoInput(el, +el.dataset.cycle, +el.dataset.week);
});
document.addEventListener("visibilitychange", () => {
  if(document.hidden){
    if(P && P.step === "play"){
      state.draft = serializeP();
      Store.save(state);
    }
  } else {
    if(P) requestWakeLock();
  }
});

render();
</script>
</body>
</html>
